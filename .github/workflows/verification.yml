# Vérifie à chaque envoi que tous les liens et fichiers utilisés par les pages existent bien.
# Peut aussi être lancée à la main : onglet « Actions » > « Vérification du site » > « Run workflow ».
name: Vérification du site

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  liens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/verifier-liens.mjs
